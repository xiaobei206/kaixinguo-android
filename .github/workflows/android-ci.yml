name: Android CI and Release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# Prevent rapid main pushes from publishing release tags concurrently.
concurrency:
  group: kaixinguo-android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test patched SDK and build APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Checkout xiaobei206/openhongguo fork (main)
        uses: actions/checkout@v4
        with:
          repository: xiaobei206/openhongguo
          ref: main
          path: .build/openhongguo

      - name: Set up Go 1.26
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 17, SDK 36 and NDK
        run: |
          sdkmanager --channel=3 "platforms;android-36" "build-tools;36.0.0" "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Add Android 17 SDK compatibility alias
        run: |
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Configure stable release signing
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$GITHUB_WORKSPACE/kaixinguo-release.jks"
          CREDENTIALS="$GITHUB_WORKSPACE/signing-secrets.txt"
          if [[ ! -s "$KEYSTORE_PATH" || ! -s "$CREDENTIALS" ]]; then
            echo '::error::The fixed signing key files are missing from the repository root.'
            exit 1
          fi
          get_value() { sed -n "s/^$1=//p" "$CREDENTIALS" | head -n 1; }
          STORE_PASSWORD="$(get_value ANDROID_KEYSTORE_PASSWORD)"
          KEY_ALIAS="$(get_value ANDROID_KEY_ALIAS)"
          KEY_PASSWORD="$(get_value ANDROID_KEY_PASSWORD)"
          if [[ -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo '::error::The signing credential file is incomplete.'
            exit 1
          fi
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          {
            printf 'storeFile=%s\n' "$KEYSTORE_PATH"
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > keystore.properties
          chmod 600 "$KEYSTORE_PATH" keystore.properties
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Patch and test openhongguo server diagnostics
        run: |
          set -euo pipefail
          python3 scripts/patch-openhongguo.py .build/openhongguo
          cd .build/openhongguo
          go test ./...
          (cd bindings/mobile/core && go test ./...)

      - name: Build patched openhongguo Android AAR
        run: |
          set -euo pipefail
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20261011034528-197770444867
          gomobile init
          cd .build/openhongguo/bindings/mobile
          chmod +x build.sh
          ./build.sh android
          test -f android/build/outputs/aar/openhongguo-release.aar

      - name: Run app unit tests and build release APKs
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleRelease \
            -PpatchedOpenhongguoAar="$GITHUB_WORKSPACE/.build/openhongguo/bindings/mobile/android/build/outputs/aar/openhongguo-release.aar"

      - name: Read application version
        id: version
        shell: bash
        run: |
          VERSION="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          CODE="$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$VERSION" && test -n "$CODE"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$CODE" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Rename APKs and generate SHA-256 checksums
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          OUT=app/build/outputs/apk/release
          mv "$OUT/app-arm64-v8a-release.apk" "$OUT/kaixinguo-android-v${VERSION}-arm64-v8a.apk"
          mv "$OUT/app-armeabi-v7a-release.apk" "$OUT/kaixinguo-android-v${VERSION}-armeabi-v7a.apk"
          mv "$OUT/app-x86_64-release.apk" "$OUT/kaixinguo-android-v${VERSION}-x86_64.apk"
          mv "$OUT/app-universal-release.apk" "$OUT/kaixinguo-android-v${VERSION}-universal.apk"
          cd "$OUT"
          sha256sum kaixinguo-android-v${VERSION}-*.apk > "kaixinguo-android-v${VERSION}-SHA256SUMS.txt"

      - name: Generate in-app updater metadata
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          set -euo pipefail
          OUT=app/build/outputs/apk/release
          python3 - "$OUT" "$VERSION" "$VERSION_CODE" <<'PY'
          import hashlib, json, pathlib, sys
          out = pathlib.Path(sys.argv[1])
          version, version_code = sys.argv[2], int(sys.argv[3])
          assets = []
          for apk in sorted(out.glob(f"kaixinguo-android-v{version}-*.apk")):
              if apk.name.endswith("-SHA256SUMS.txt") or apk.name.endswith("-update.json"):
                  continue
              digest = hashlib.sha256(apk.read_bytes()).hexdigest()
              assets.append({"name": apk.name, "sha256": digest})
          if len(assets) != 4:
              raise SystemExit(f"Expected 4 APKs, found {len(assets)}")
          metadata = {"schemaVersion": 1, "versionName": version, "versionCode": version_code, "assets": assets}
          target = out / f"kaixinguo-android-v{version}-update.json"
          target.write_text(json.dumps(metadata, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(f"Wrote {target}")
          PY

      - name: Verify APK signatures and certificate consistency
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SIGNING_CONFIGURED: ${{ steps.signing.outputs.configured }}
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          test -x "$APKSIGNER"
          OUT=app/build/outputs/apk/release
          fingerprints=()
          for apk in "$OUT"/kaixinguo-android-v${VERSION}-*.apk; do
            test -f "$apk"
            result="$("$APKSIGNER" verify --verbose --print-certs "$apk" 2>&1)"
            fingerprint="$(printf '%s\n' "$result" | sed -n -E 's/^(Signer #[0-9]+ |V[0-9]+ Signer: )certificate SHA-256 digest: //p' | head -n 1 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
            if [[ -z "$fingerprint" ]]; then
              printf 'APK signature verification did not return a signer certificate: %s\n%s\n' "$apk" "$result"
              exit 1
            fi
            printf 'Verified %s — signer SHA-256 %s\n' "$(basename "$apk")" "$fingerprint"
            fingerprints+=("$fingerprint")
          done
          test "${#fingerprints[@]}" -eq 4
          unique_count="$(printf '%s\n' "${fingerprints[@]}" | sort -u | wc -l | tr -d ' ')"
          if [[ "$unique_count" != "1" ]]; then
            echo '::error::The ABI APKs do not use the same signing certificate.'
            exit 1
          fi
          if [[ "$SIGNING_CONFIGURED" == 'true' ]]; then
            STORE_PASSWORD="$(sed -n 's/^ANDROID_KEYSTORE_PASSWORD=//p' signing-secrets.txt | head -n 1)"
            KEY_ALIAS="$(sed -n 's/^ANDROID_KEY_ALIAS=//p' signing-secrets.txt | head -n 1)"
            expected="$(keytool -exportcert -alias "$KEY_ALIAS" -keystore "$GITHUB_WORKSPACE/kaixinguo-release.jks" -storepass "$STORE_PASSWORD" 2>/dev/null | sha256sum | awk '{print toupper($1)}')"
            if [[ "${fingerprints[0]}" != "$expected" ]]; then
              echo '::error::The APK certificate does not match the committed persistent keystore.'
              exit 1
            fi
          fi

      - name: Build release notes from CHANGELOG
        id: release_notes
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          awk -v version="$VERSION" '
            index($0, "## [" version "]") == 1 { found=1; print; next }
            found && /^## \[/ { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > release-notes.md
          cat >> release-notes.md <<EOF

          ## 下载
          - **kaixinguo-android-v${VERSION}-arm64-v8a.apk**：推荐近年安卓手机（华为、荣耀、小米、OPPO、vivo 等）
          - **kaixinguo-android-v${VERSION}-universal.apk**：不确定设备架构时使用
          - kaixinguo-android-v${VERSION}-armeabi-v7a.apk：旧款 32 位 ARM 设备
          - kaixinguo-android-v${VERSION}-x86_64.apk：安卓模拟器

          SHA-256 校验值见 kaixinguo-android-v${VERSION}-SHA256SUMS.txt。
          EOF
          {
            echo 'body<<RELEASE_BODY_EOF'
            cat release-notes.md
            echo 'RELEASE_BODY_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Upload APKs as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: hongguo-quguang-android-${{ steps.version.outputs.version }}-${{ github.run_number }}-fixed-signing
          path: |
            app/build/outputs/apk/release/kaixinguo-android-v${{ steps.version.outputs.version }}-*.apk
            app/build/outputs/apk/release/kaixinguo-android-v${{ steps.version.outputs.version }}-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Check whether this version is already released
        id: release_check
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        if: steps.release_check.outputs.exists == 'false' && steps.signing.outputs.configured == 'true' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          make_latest: legacy
          name: 红果去广 Android v${{ steps.version.outputs.version }}
          body: ${{ steps.release_notes.outputs.body }}
          files: |
            app/build/outputs/apk/release/kaixinguo-android-v${{ steps.version.outputs.version }}-arm64-v8a.apk
            app/build/outputs/apk/release/kaixinguo-android-v${{ steps.version.outputs.version }}-armeabi-v7a.apk
            app/build/outputs/apk/release/kaixinguo-android-v${{ steps.version.outputs.version }}-x86_64.apk
            app/build/outputs/apk/release/kaixinguo-android-v${{ steps.version.outputs.version }}-universal.apk
            app/build/outputs/apk/release/kaixinguo-android-v${{ steps.version.outputs.version }}-SHA256SUMS.txt
            app/build/outputs/apk/release/kaixinguo-android-v${{ steps.version.outputs.version }}-update.json
          fail_on_unmatched_files: true
          generate_release_notes: false
