name: Android CI and Release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Test patched SDK and build APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Checkout openhongguo v0.4.0 source
        uses: actions/checkout@v4
        with:
          repository: beilunyang/openhongguo
          ref: v0.4.0
          path: .build/openhongguo

      - name: Set up Go 1.26
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 17, SDK 36 and NDK
        run: |
          sdkmanager --channel=3 "platforms;android-36" "build-tools;36.0.0" "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Add Android 17 SDK compatibility alias
        run: |
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Patch and test openhongguo server diagnostics
        run: |
          set -euo pipefail
          python3 scripts/patch-openhongguo.py .build/openhongguo
          cd .build/openhongguo
          go test ./...
          (cd bindings/mobile/core && go test ./...)

      - name: Build patched openhongguo Android AAR
        run: |
          set -euo pipefail
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20261011034528-197770444867
          gomobile init
          cd .build/openhongguo/bindings/mobile
          chmod +x build.sh
          ./build.sh android
          test -f android/build/outputs/aar/openhongguo-release.aar

      - name: Run app unit tests and build release APKs
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleRelease \
            -PpatchedOpenhongguoAar="$GITHUB_WORKSPACE/.build/openhongguo/bindings/mobile/android/build/outputs/aar/openhongguo-release.aar"

      - name: Read application version
        id: version
        shell: bash
        run: |
          VERSION="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Rename APKs and generate SHA-256 checksums
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          OUT=app/build/outputs/apk/release
          mv "$OUT/app-arm64-v8a-release.apk" "$OUT/kaixinguo-android-v${VERSION}-arm64-v8a.apk"
          mv "$OUT/app-armeabi-v7a-release.apk" "$OUT/kaixinguo-android-v${VERSION}-armeabi-v7a.apk"
          mv "$OUT/app-x86_64-release.apk" "$OUT/kaixinguo-android-v${VERSION}-x86_64.apk"
          mv "$OUT/app-universal-release.apk" "$OUT/kaixinguo-android-v${VERSION}-universal.apk"
          cd "$OUT"
          sha256sum kaixinguo-android-v${VERSION}-*.apk > "kaixinguo-android-v${VERSION}-SHA256SUMS.txt"

      - name: Build release notes from CHANGELOG
        id: release_notes
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          awk -v version="$VERSION" '
            index($0, "## [" version "]") == 1 { found=1; print; next }
            found && /^## \[/ { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > release-notes.md
          cat >> release-notes.md <<EOF

          ## 下载
          - **kaixinguo-android-v${VERSION}-arm64-v8a.apk**：推荐近年安卓手机（华为、荣耀、小米、OPPO、vivo 等）
          - **kaixinguo-android-v${VERSION}-universal.apk**：不确定设备架构时使用
          - kaixinguo-android-v${VERSION}-armeabi-v7a.apk：旧款 32 位 ARM 设备
          - kaixinguo-android-v${VERSION}-x86_64.apk：安卓模拟器

          SHA-256 校验值见 kaixinguo-android-v${VERSION}-SHA256SUMS.txt。
          EOF
          {
            echo 'body<<RELEASE_BODY_EOF'
            cat release-notes.md
            echo 'RELEASE_BODY_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Upload APKs as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: kaixinguo-android-${{ steps.version.outputs.version }}-${{ github.run_number }}
          path: |
            app/build/outputs/apk/release/kaixinguo-android-v${{ steps.version.outputs.version }}-*.apk
            app/build/outputs/apk/release/kaixinguo-android-v${{ steps.version.outputs.version }}-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Check whether this version is already released
        id: release_check
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        if: steps.release_check.outputs.exists == 'false' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: 开心果 Android v${{ steps.version.outputs.version }}
          body: ${{ steps.release_notes.outputs.body }}
          files: |
            app/build/outputs/apk/release/kaixinguo-android-v${{ steps.version.outputs.version }}-arm64-v8a.apk
            app/build/outputs/apk/release/kaixinguo-android-v${{ steps.version.outputs.version }}-armeabi-v7a.apk
            app/build/outputs/apk/release/kaixinguo-android-v${{ steps.version.outputs.version }}-x86_64.apk
            app/build/outputs/apk/release/kaixinguo-android-v${{ steps.version.outputs.version }}-universal.apk
            app/build/outputs/apk/release/kaixinguo-android-v${{ steps.version.outputs.version }}-SHA256SUMS.txt
          fail_on_unmatched_files: true
          generate_release_notes: false
